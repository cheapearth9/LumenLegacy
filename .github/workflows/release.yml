name: Build & Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Next version
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.next.outputs.v }}
    steps:
      # Bug fixes bump the last number (1.0 -> 1.0.1 -> 1.0.2). A push whose commit message contains [major] bumps the
      # middle number instead (1.0.2 -> 1.1), and after .9 it rolls over (1.9 -> 2.0, never 1.10). Never the run number.
      - id: next
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          tags=$(gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate --jq '.[].tag_name' 2>/dev/null || true)
          best=$(echo "$tags" | sed -n 's/^v\([0-9]\+\)\.\([0-9]\+\)\(\.\([0-9]\+\)\)\?$/\1 \2 \4/p' | sed 's/ $/ 0/' | awk '{ if (NF==2) $3=0; print }' | sort -k1,1n -k2,2n -k3,3n | tail -1)
          if [ -z "$best" ]; then
            v="1.0"
          else
            set -- $best; maj=$1; min=$2; pat=${3:-0}
            # Bug fixes bump the 3rd number; after .9 (2.0.9) the next release is a major one (2.1), then 2.1.1, 2.1.2 ...
            if echo "$MSG" | grep -qi '\[major\]' || [ "$pat" -ge 9 ]; then
              if [ "$min" -ge 9 ]; then v="$((maj + 1)).0"; else v="$maj.$((min + 1))"; fi
            else
              v="$maj.$min.$((pat + 1))"
            fi
          fi
          echo "next version: $v (existing: $(echo $tags | tr '\n' ' '))"
          echo "v=$v" >> "$GITHUB_OUTPUT"

  ios:
    name: iOS 12+ .ipa
    needs: version
    env:
      LUMEN_VERSION: ${{ needs.version.outputs.v }}
    # macos-15 ships Xcode 16.x, which still accepts an iOS 12.0 deployment target (newer Xcode releases raise the minimum).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (newest 16.x, supports iOS 12.0 deployment target)
        run: |
          ls -d /Applications/Xcode*.app || true
          pick=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$pick" ]; then sudo xcode-select -s "$pick"; fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Crypto self-test (legacy CommonCrypto/Security code vs CryptoKit, runs on the Mac)
        run: |
          set -o pipefail
          mkdir -p build
          swiftc -O Shared/Crypto.swift Tools/SelfTest/main.swift -o build/selftest
          ./build/selftest

      - name: Stamp version into project (becomes CFBundleShortVersionString / CFBundleVersion in Info.plist)
        run: |
          sed -i '' "s/MARKETING_VERSION: .*/MARKETING_VERSION: \"$LUMEN_VERSION\"/; s/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: \"${{ github.run_number }}\"/" project.yml
          grep -n "MARKETING_VERSION\|CURRENT_PROJECT_VERSION\|deploymentTarget\|iOS:" project.yml

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS client (unsigned, iOS 12.0 deployment target)
        run: |
          set -o pipefail
          # Deprecation warnings (the legacy code deliberately uses some APIs newer SDKs flag) must not fail the build.
          xcodebuild \
            -project LumenLegacy.xcodeproj \
            -scheme LumenLegacy \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Check version and deployment target in built Info.plist
        run: |
          APP=$(find build/ios/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          v=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")
          min=$(/usr/libexec/PlistBuddy -c 'Print MinimumOSVersion' "$APP/Info.plist")
          echo "Info.plist version: $v, MinimumOSVersion: $min"
          [ "$v" = "$LUMEN_VERSION" ] || { echo "version mismatch ($v vs $LUMEN_VERSION)"; exit 1; }
          [ "$min" = "12.0" ] || { echo "unexpected MinimumOSVersion $min"; exit 1; }

      - name: Package .ipa
        run: |
          APP=$(find build/ios/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          echo "App bundle: $APP"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          (cd dist && zip -qry Lumen-Legacy.ipa Payload && rm -rf Payload)
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/Lumen-Legacy.ipa
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -la dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.v }}
          name: Lumen Legacy v${{ needs.version.outputs.v }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            dist/Lumen-Legacy.ipa
